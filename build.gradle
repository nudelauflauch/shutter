plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = "https://www.cursemaven.com"
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven { url = 'https://maven.minecraftforge.net/' }
}


loom {
	splitEnvironmentSourceSets()

	mods {
		"shutter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(
			files(
					"$rootDir/run/mods/ecologics-fabric-1.20.1-2.2.0.jar",
			)
	)

//	 forge/neoforge/fabric 1.20.1
	modImplementation ("curse.maven:lets-do-beachparty-858691:5320667")
//	// forge/neoforge/fabric 1.20.1
//	modImplementation("curse.maven:ecologics-570463:4857271")
//	// forge/X/fabric 1.20.1
	modImplementation "curse.maven:twigs-496913:4603805"
//	// forge/neoforge/fabric 1.21.1
	modImplementation "curse.maven:snowy-spirit-566142:5928028"
//	// forge/X/fabric 1.20.1
	modImplementation ("curse.maven:good-ending-690161:5024404")

	modImplementation ("curse.maven:architectury-api-419699:5137936")
	modImplementation ("curse.maven:moonlight-lib-499980:6682356")
	modImplementation ("curse.maven:doapi-864599:5468180")
	modImplementation "com.terraformersmc.terraform-api:terraform-wood-api-v1:7.0.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}