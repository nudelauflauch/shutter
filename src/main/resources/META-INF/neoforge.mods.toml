license="${mod_license}"
issueTrackerURL="https://github.com/nudelauflauch/shutter/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

displayURL="https://www.curseforge.com/minecraft/mc-mods/lauchs-shutters"
ogoFile="assets/shutter/textures/gui/main.png"
credits="Thanks go to Nudelauflauch for the textures and to all who translated the mod to different languages"
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[mixins]]
config="mixins.${mod_id}.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
